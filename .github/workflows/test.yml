# SKPL Agent — Full Test Matrix
#
# Runs on every push and PR to main. Exercises the complete test suite
# across Python 3.11, 3.12, and 3.13 with separate jobs for unit,
# integration, parity, and performance tests.
#
# Coverage is uploaded to Codecov from the Python 3.12 job.

name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # =========================================================================
  # Unit Tests — Fast, isolated, run first
  # =========================================================================
  unit-tests:
    name: "Unit Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[service,context,dev]"

      - name: Run unit tests
        run: |
          pytest backend/tests/unit \
            -v \
            --tb=short \
            --cov=backend/src/skpl_agent \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-unit
          path: coverage-unit.xml

  # =========================================================================
  # Integration Tests — Need services (Postgres, Redis)
  # =========================================================================
  integration-tests:
    name: "Integration Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skpl
          POSTGRES_PASSWORD: skpl_test
          POSTGRES_DB: skpl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[service,storage-sql,context,web,dev]"

      - name: Run integration tests
        env:
          SKPL_DB_URL: postgresql+asyncpg://skpl:skpl_test@localhost:5432/skpl_test
          SKPL_REDIS_URL: redis://localhost:6379/0
        run: |
          pytest backend/tests/integration \
            -v \
            -m "integration" \
            --tb=short \
            --cov=backend/src/skpl_agent \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term \
            --cov-append \
            --timeout=120

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-integration
          path: coverage-integration.xml

  # =========================================================================
  # Parity Tests — OpenWolf compatibility
  # =========================================================================
  parity-tests:
    name: Parity Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[service,context,dev]"

      - name: Run parity tests
        run: |
          pytest backend/tests/parity \
            -v \
            --tb=short \
            --timeout=180

  # =========================================================================
  # Performance Tests — Benchmark context operations
  # =========================================================================
  performance-tests:
    name: Performance Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[service,context,dev]"

      - name: Run performance tests
        run: |
          pytest backend/tests/performance \
            -v \
            --tb=short \
            --benchmark-only \
            --timeout=300

  # =========================================================================
  # Coverage Upload — Aggregate and upload to Codecov
  # =========================================================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage-unit.xml,coverage-integration.xml
          flags: unittests,integration
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}