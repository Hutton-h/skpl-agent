# Pre-commit Hooks for SKPL Agent
#
# Install: pre-commit install
# Run all:  pre-commit run --all-files
#
# Hooks run on git commit to ensure code quality before pushing.

repos:
  # =========================================================================
  # General file hygiene
  # =========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        name: Ensure files end with a newline
      - id: check-yaml
        name: Validate YAML syntax
        args: [--allow-multiple-documents]
      - id: check-json
        name: Validate JSON syntax
      - id: check-toml
        name: Validate TOML syntax
      - id: check-added-large-files
        name: Prevent large files from being committed
        args: [--maxkb=500]
      - id: check-merge-conflict
        name: Check for merge conflict markers
      - id: check-case-conflict
        name: Check for case-insensitive filename conflicts
      - id: mixed-line-ending
        name: Normalize line endings
        args: [--fix=lf]
      - id: detect-private-key
        name: Detect accidentally committed private keys
      - id: detect-aws-credentials
        name: Detect AWS credentials

  # =========================================================================
  # Python: Ruff (linter + formatter)
  # =========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        name: Ruff lint
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/src/
      - id: ruff-format
        name: Ruff format
        files: ^backend/src/

  # =========================================================================
  # Python: MyPy (type checking)
  # =========================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        name: MyPy type check
        args:
          - --ignore-missing-imports
          - --no-namespace-packages
        files: ^backend/src/skpl_agent/
        additional_dependencies:
          - pydantic>=2.0
          - types-pyyaml
          - types-requests
        pass_filenames: false

  # =========================================================================
  # Secrets detection
  # =========================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
            backend/tests/.*|
            frontend/.*\.lock|
            .*\.pyc
          )$