# SKPL Agent — Horizontal Pod Autoscaler
# Automatically scales the backend and frontend deployments based on CPU/memory usage.
#
# Usage:
#   kubectl apply -f deploy/k8s/hpa.yaml
#   kubectl -n skpl-agent get hpa

---
# =========================================================================
# Backend HPA
# =========================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skpl-backend
  namespace: skpl-agent
  labels:
    app.kubernetes.io/name: skpl-agent
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: skpl-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skpl-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes before scaling down
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min  # Conservative scale-down

    scaleUp:
      stabilizationWindowSeconds: 60  # 1 minute before scaling up
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max  # Aggressive scale-up

---
# =========================================================================
# Frontend HPA
# =========================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skpl-frontend
  namespace: skpl-agent
  labels:
    app.kubernetes.io/name: skpl-agent
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: skpl-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skpl-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Min

    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 3
          periodSeconds: 30
      selectPolicy: Max

