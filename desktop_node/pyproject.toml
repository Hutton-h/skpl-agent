[project]
name = "skpl-desktop-node"
dynamic = ["version"]
description = "SKPL Desktop Node — lightweight edge agent for desktop automation tasks"
readme = "README.md"
authors = [
    { name = "SKPL Agent Contributors" }
]
license = "AGPL-3.0"
license-files = ["LICENSE"]
keywords = ["desktop-automation", "agent", "RPA", "accessibility", "pyautogui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"

dependencies = [
    # ── Core desktop automation ──
    "pyautogui>=0.9.54",
    "pillow>=10.0",
    "mss>=9.0",
    "pyperclip>=1.8",
    "pynput>=1.7",

    # ── Network / communication ──
    "websockets>=12.0",
    "pyjwt>=2.8",

    # ── Data validation ──
    "pydantic>=2.0",

    # ── Logging ──
    "structlog>=24.0",

    # ── System info ──
    "psutil>=5.9",
]

[project.optional-dependencies]
# ── Platform-specific desktop automation ──
# Windows: pywinauto + win32 bindings
windows = [
    "pywinauto>=0.6.8",
    "pywin32>=306",
]

# macOS: Accessibility API via pyobjc
macos = [
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
]

# Linux: AT-SPI via pyatspi
linux = [
    "pyatspi>=2.46",
]

# ── OCR backends (optional, large) ──
ocr-easy = [
    "easyocr>=1.7",
    "opencv-python-headless>=4.9",
]

ocr-paddle = [
    "paddleocr>=2.8",
    "paddlepaddle>=3.0",
    "opencv-python-headless>=4.9",
]

# ── Grounding models (optional, large) ──
grounding = [
    "torch>=2.0",
    "transformers>=4.40",
    "huggingface-hub>=0.20",
]

# ── Full installation ──
full = [
    "skpl-desktop-node[windows]",
    "skpl-desktop-node[macos]",
    "skpl-desktop-node[linux]",
    "skpl-desktop-node[ocr-easy]",
    "skpl-desktop-node[grounding]",
]

# ── Development ──
dev = [
    "skpl-desktop-node[full]",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[project.urls]
Homepage = "https://github.com/skpl-agent/skpl-agent"
Documentation = "https://skpl-agent.dev/"
Repository = "https://github.com/skpl-agent/skpl-agent"

[project.scripts]
skpl-desktop-node = "skpl_desktop_node.cli:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["src"] } }
include-package-data = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "skpl_desktop_node.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow",
    "desktop: marks tests that require a desktop environment",
    "ocr: marks tests that require OCR dependencies",
    "grounding: marks tests that require grounding model dependencies",
]